server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/javascript application/wasm application/octet-stream application/json text/css;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(wasm|data|unityweb)$ { add_header Cache-Control "public, max-age=3600"; }
}
